    <!-- Fonts Ready & Initial Preloader Failsafe Script -->
    <script>
      (function () {
        var markFontsReady = function () {
          if (document.documentElement.classList.contains('fonts-ready')) return;
          document.documentElement.classList.add('fonts-ready');
          window.__fontsReady = true;
          window.dispatchEvent(new CustomEvent('fonts:ready'));
        };

        // 1200ms failsafe timer so the page can never stay hidden
        var failsafeTimer = setTimeout(markFontsReady, 1200);

        if (document.fonts && document.fonts.load) {
          Promise.all([
            document.fonts.load('300 1em "Inter Tight Variable"'),
            document.fonts.load('250 1em "Inter Tight Variable"'),
            document.fonts.load('italic 1em "Instrument Serif"'),
            document.fonts.ready,
          ])
            .then(function () {
              clearTimeout(failsafeTimer);
              markFontsReady();
            })
            .catch(function () {
              clearTimeout(failsafeTimer);
              markFontsReady();
            });
        } else {
          markFontsReady();
        }

        // Hide preloader overlay if not home or already seen or reduced motion
        try {
          var p = window.location.pathname;
          var isHome = p === '/' || p === '/portfolio/' || p === '/portfolio';
          var seen = sessionStorage.getItem('preloader_seen') === 'true';
          var reduced =
            window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!isHome || seen || reduced) {
            var el = document.getElementById('preloader-overlay');
            if (el) el.style.display = 'none';
          }
        } catch (e) {}
      })();
    </script>
