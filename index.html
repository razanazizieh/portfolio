<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F4F0" />

    <!-- Primary Metadata -->
    <script>
      // Suppress Vite HMR / WebSocket errors in iframe environment
      window.addEventListener("error", function (e) {
        if (
          e.message &&
          (e.message.includes("send was called before connect") ||
            e.message.includes("WebSocket") ||
            e.message.includes("[vite]"))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener("unhandledrejection", function (e) {
        if (
          e.reason &&
          typeof e.reason.message === "string" &&
          (e.reason.message.includes("send was called before connect") ||
            e.reason.message.includes("WebSocket") ||
            e.reason.message.includes("[vite]"))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
    <title>Razan Azizieh, Front-end Developer</title>
    <meta
      name="description"
      content="Razan Azizieh is a Front-end Developer with a background in mathematics and informatics, building interfaces with React and distributed systems."
    />
